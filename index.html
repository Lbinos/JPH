<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>JPH Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --text: #f0f0f0;
      --muted: #8888aa;
      --border: #2a2a45;
      --input-bg: #0d0d20;
      --radius: 14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top, 16px) 14px env(safe-area-inset-bottom, 12px);
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 10px 0 6px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      margin-top: 8px;
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Fields ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field + .field {
      margin-top: 10px;
    }

    .field label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="number"] {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      padding: 9px 13px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s;
      min-width: 0;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"]::placeholder {
      color: var(--border);
      font-weight: 400;
      font-size: 15px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    .unit-badge {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Slider ── */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 5px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(79,142,247,0.5);
    }

    .pct-display {
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 6px 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      min-width: 54px;
      text-align: center;
    }

    /* ── Results ── */
    .result-card {
      background: linear-gradient(135deg, #1a2a4a, #1a1a35);
      border: 1px solid rgba(79, 142, 247, 0.3);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex: 1;
    }

    .result-item {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .result-item.primary {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(124,92,191,0.15));
      border-color: rgba(79,142,247,0.4);
    }

    .result-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .result-value {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: var(--accent);
      line-height: 1;
    }

    .result-item:not(.primary) .result-value {
      font-size: 26px;
      letter-spacing: -0.5px;
    }

    .result-unit {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .result-value.empty {
      color: var(--border);
      letter-spacing: 0;
    }

    .result-item.over-tct {
      border-color: rgba(239,68,68,0.5);
      background: rgba(239,68,68,0.08);
    }

    .result-item.over-tct .result-value {
      color: #ef4444;
    }

    .result-item.under-tct {
      border-color: rgba(34,197,94,0.5);
      background: rgba(34,197,94,0.08);
    }

    .result-item.under-tct .result-value {
      color: #22c55e;
    }

    .tct-target {
      font-size: 9px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Bottom row ── */
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-top: 8px;
    }

    .formula-note {
      flex: 1;
      font-size: 10px;
      color: var(--muted);
      opacity: 0.7;
      line-height: 1.3;
    }

    .btn-reset {
      padding: 11px 18px;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }

    .btn-reset:active {
      background: var(--border);
      color: var(--text);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f4f8;
        --card: #ffffff;
        --card2: #f0f2f8;
        --text: #111122;
        --muted: #6666aa;
        --border: #d0d4e8;
        --input-bg: #f8f9ff;
      }
      .result-card {
        background: linear-gradient(135deg, #e8f0ff, #f0e8ff);
        border-color: rgba(79,142,247,0.25);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>JPH Calculator</h1>
    <p>Jobs Per Hour from Cycle Time</p>
  </header>

  <main>

    <!-- Cycle Time -->
    <div class="card">
      <div class="card-title">Cycle Time</div>
      <div class="field">
        <label>Actual Cycle Time</label>
        <div class="input-row">
          <input type="number" id="cycleInput" inputmode="decimal" placeholder="e.g. 136" min="0" step="any" />
          <span class="unit-badge">sec</span>
        </div>
      </div>
      <div class="field">
        <label>Target Cycle Time (TCT)</label>
        <div class="input-row">
          <input type="number" id="tctInput" inputmode="decimal" placeholder="e.g. 120" min="0" step="any" />
          <span class="unit-badge">sec</span>
        </div>
      </div>
    </div>

    <!-- Operation Rate -->
    <div class="card">
      <div class="card-title">Operation Rate</div>
      <div class="field">
        <label>Efficiency / Availability</label>
        <div class="slider-row">
          <input type="range" id="rateSlider" min="1" max="100" value="100" />
          <div class="pct-display" id="rateDisplay">100%</div>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div class="card result-card">
      <div class="card-title">Results</div>
      <div class="result-grid">
        <div class="result-item primary">
          <div class="result-label">JPH with Operation Rate</div>
          <div class="result-value" id="jphEffective">—</div>
          <div class="result-unit">jobs / hour</div>
        </div>
        <div class="result-item">
          <div class="result-label">Base JPH</div>
          <div class="result-value" id="jphBase">—</div>
          <div class="result-unit">jobs / hr</div>
        </div>
        <div class="result-item" id="tctItem">
          <div class="result-label">TCT</div>
          <div class="result-value" id="cycleSeconds">—</div>
          <div class="result-unit">seconds</div>
          <div class="tct-target" id="tctTarget"></div>
        </div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom-row">
      <p class="formula-note">JPH = (3600 ÷ cycle sec) × rate %</p>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>

  </main>

  <script>
    const cycleInput   = document.getElementById('cycleInput');
    const tctInput     = document.getElementById('tctInput');
    const rateSlider   = document.getElementById('rateSlider');
    const rateDisplay  = document.getElementById('rateDisplay');
    const jphBase      = document.getElementById('jphBase');
    const jphEffective = document.getElementById('jphEffective');
    const cycleSeconds = document.getElementById('cycleSeconds');
    const tctItem      = document.getElementById('tctItem');
    const tctTarget    = document.getElementById('tctTarget');
    const resetBtn     = document.getElementById('resetBtn');

    function fmt(n, decimals = 1) {
      if (!isFinite(n) || n <= 0) return '—';
      const d = n < 10 ? 2 : decimals;
      return n.toFixed(d).replace(/\.?0+$/, '');
    }

    function calculate() {
      const raw  = parseFloat(cycleInput.value);
      const rate = parseFloat(rateSlider.value) || 100;

      if (isNaN(raw) || raw <= 0) {
        jphBase.textContent      = '—';
        jphEffective.textContent = '—';
        cycleSeconds.textContent = '—';
        [jphBase, jphEffective, cycleSeconds].forEach(el => el.classList.add('empty'));
        return;
      }

      const secs   = raw;
      const base   = 3600 / secs;
      const effect = base * (rate / 100);

      jphBase.textContent      = fmt(base);
      jphEffective.textContent = fmt(effect);
      cycleSeconds.textContent = secs < 1 ? secs.toFixed(3) : fmt(secs, 1);
      [jphBase, jphEffective, cycleSeconds].forEach(el => el.classList.remove('empty'));

      const tct = parseFloat(tctInput.value);
      tctItem.classList.remove('over-tct', 'under-tct');
      if (!isNaN(tct) && tct > 0) {
        if (raw > tct) {
          tctItem.classList.add('over-tct');
          tctTarget.textContent = `TARGET: ${tct}s  ▲ +${fmt(raw - tct, 1)}s`;
        } else {
          tctItem.classList.add('under-tct');
          tctTarget.textContent = `TARGET: ${tct}s  ✓`;
        }
      } else {
        tctTarget.textContent = '';
      }
    }

    rateSlider.addEventListener('input', () => {
      rateDisplay.textContent = rateSlider.value + '%';
      calculate();
    });

    cycleInput.addEventListener('input', calculate);
    tctInput.addEventListener('input', calculate);

    resetBtn.addEventListener('click', () => {
      cycleInput.value = '';
      tctInput.value   = '';
      rateSlider.value = 100;
      rateDisplay.textContent = '100%';
      tctItem.classList.remove('over-tct', 'under-tct');
      tctTarget.textContent = '';
      calculate();
      cycleInput.focus();
    });

    calculate();
  </script>
</body>
</html>
